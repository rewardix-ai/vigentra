<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vigentra · Story Edition</title>
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/stage.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/scenes.css">
<link rel="stylesheet" href="css/lens.css">
</head>
<body class="lens">
<div id="viewport"><main id="stage" aria-live="polite">
  <div id="lnav" aria-hidden="true">
    <span class="ln-brand"><img src="brand/vigentra-mark.png" alt=""><img src="brand/vigentra-wordmark.png" alt=""></span>
    <span class="ln-right"><span id="tb-act" class="ln-pill"></span><span id="tb-n" class="ln-n"></span></span>
  </div>
</main></div>

<div id="hud">
  <div id="progress"><div id="progress-fill"></div></div>
  <div id="auto-bar"><div id="auto-fill"></div></div>
  <span id="hud-act"></span>
  <div id="hud-buttons">
    <button id="nav-prev" title="Previous (←)">←</button>
    <button id="nav-next" title="Next (→ or Space)">→</button>
    <button id="nav-grid" title="All scenes (G)">Scenes</button>
    <button id="nav-tech" title="Technical layer (T)">Tech</button>
    <button id="nav-auto" title="Auto-advance after videos (A)">Auto</button>
  </div>
  <span id="hud-count"></span>
</div>
<div id="notes" hidden></div>
<div id="grid" hidden></div>

<!-- data: real numbers, real media, the storyboard -->
<script src="js/data/project.js"></script>
<script src="js/data/assets.js"></script>
<script src="js/data/evidence.js"></script>
<script src="js/data/storyboard.js"></script>
<!-- engine -->
<script src="js/core/anim.js"></script>
<script src="js/core/media.js"></script>
<script src="js/core/engine.js"></script>
<!-- components -->
<script src="js/components/chars.js"></script>
<script src="js/components/overlay.js"></script>
<script src="js/components/controls.js"></script>
<script src="js/components/wall.js"></script>
<script src="js/components/flow.js"></script>
<!-- story edition: the same engine, data and parts; its own scenes -->
<script src="js/scenes/helpers.js"></script>
<script src="js/scenes/charts.js"></script>
<script src="js/lens/01-story.js"></script>
<script src="js/lens/02-proof.js"></script>
<script>K.start();</script>
</body>
</html>
