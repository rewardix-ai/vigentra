# Vigentra - the whole stack, run with Docker Compose.
#
#   postgres            registry storage
#   traffic-vms         Traffic Police department system (mock)        :8001
#   municipal-vms       Municipal Corporation department system (mock) :8002
#   central-api         Vigentra middleware                            :8000
#   grid-snapshots      live-wall frames, decoded over RTSP            (internal)
#   detector-traffic    24/7 object detection, Traffic cameras
#   detector-municipal  24/7 object detection, Municipal cameras
#   dashboard           operator console                               :3000
#   edge-worker         number-plate reading - only with --profile anpr
#
# Bring the whole stack up with:  docker compose up -d --build
# Sign in from http://localhost:3000/login (accounts on that page).
#
# The live grid allows about six concurrent streams per account and blocks the
# account under load. grid-snapshots (4) plus the two detectors (1 each) keeps
# this stack at six; `--profile anpr` adds a seventh.
#
# Turn a department system off during the demo to prove failure isolation:
#   docker compose stop municipal-vms
# Turn it back on to see cameras recover:
#   docker compose start municipal-vms   &&   click "Synchronise metadata"

# Shared by detector-traffic and detector-municipal, which differ only in the
# account they sign in as (an AI account may ingest only its own department's
# cameras) and the volume that keeps their model weights.
x-detector: &detector
  build:
    context: .
    dockerfile: services/edge-worker/Dockerfile
    target: yolo
  image: vigentra/edge-worker-yolo:0.2.0
  restart: unless-stopped
  environment: &detector-env
    CENTRAL_API_URL: http://central-api:8000
    SENTINEL_GRID_BASE_URL: ${SENTINEL_GRID_BASE_URL:-https://cctv.corp8.cloud}
    SENTINEL_GRID_PASSWORD: ${SENTINEL_GRID_PASSWORD:-}
    SENTINEL_GRID_EMAIL: ${SENTINEL_GRID_EMAIL:-}
    SENTINEL_GRID_RTSP_HOST: ${SENTINEL_GRID_RTSP_HOST:-103.250.160.189}
    YOLO_ENABLE: "true"
    YOLO_DEVICE: cpu
    # Fetch yolo11n.pt once on first start, INTO the volume: Ultralytics
    # downloads to the path it is given, and a bare name lands in the
    # working directory, which a recreated container loses.
    YOLO_ALLOW_DOWNLOAD: "true"
    YOLO_WEIGHTS_DIR: /app/weights
    YOLO_MODEL_NAME: /app/weights/yolo11n.pt
  command: >
    python -m app.worker --all-cameras --forever
    --max-frames ${EDGE_MAX_FRAMES:-25}
    --sample-interval ${EDGE_SAMPLE_INTERVAL:-20}
    --cycle-seconds ${EDGE_CYCLE_SECONDS:-120}
  depends_on:
    central-api: { condition: service_healthy }

services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports: ["5432:5432"]
    volumes: [sentinel_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  traffic-vms:
    build:
      # Root context so the shared demo footage in data/videos/ can be baked in.
      context: .
      dockerfile: services/traffic-vms/Dockerfile
    image: vigentra/traffic-vms:0.2.0
    restart: unless-stopped
    environment:
      TRAFFIC_VMS_API_KEY: ${TRAFFIC_VMS_API_KEY:-traffic-demo-key}
      # Where this mock tells callers its media lives. Vigentra proxies those
      # bytes server-side, so the address has to resolve INSIDE the compose
      # network - a browser never sees it. localhost here would mean
      # "central-api itself", which is how this silently 502s.
      TRAFFIC_VMS_PUBLIC_BASE_URL: http://traffic-vms:8001
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  municipal-vms:
    build:
      context: .
      dockerfile: services/municipal-vms/Dockerfile
    image: vigentra/municipal-vms:0.2.0
    restart: unless-stopped
    environment:
      MUNICIPAL_VMS_TOKEN: ${MUNICIPAL_VMS_TOKEN:-municipal-demo-token}
      # Container-routable, for the same reason as traffic-vms above.
      MUNICIPAL_VMS_PUBLIC_BASE_URL: http://municipal-vms:8002
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  central-api:
    build:
      context: .
      dockerfile: services/central-api/Dockerfile
    image: vigentra/central-api:0.2.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
      # Both department systems federate the live grid. Stated explicitly
      # rather than left to defaults, because when these are off the registry
      # builds no adapters at all and every route that needs one returns 503.
      # The grid moved to cctv.corp8.cloud and is behind a shared access
      # password; RTSP is on the public gateway because a CDN cannot proxy it.
      SENTINEL_GRID_BASE_URL: ${SENTINEL_GRID_BASE_URL:-https://cctv.corp8.cloud}
      SENTINEL_GRID_PASSWORD: ${SENTINEL_GRID_PASSWORD:-}
      SENTINEL_GRID_EMAIL: ${SENTINEL_GRID_EMAIL:-}
      SENTINEL_GRID_RTSP_HOST: ${SENTINEL_GRID_RTSP_HOST:-103.250.160.189}
      # The live wall shows still frames the grid-snapshots service decodes
      # over the fast RTSP gateway; the HLS CDN is far too slow to feed a
      # browser player. central-api proxies them behind the video permission.
      EDGE_SNAPSHOT_URL: ${EDGE_SNAPSHOT_URL:-http://grid-snapshots:9100}
      # The gateway is reached over the public internet behind a sign-in, so
      # it does not share the LAN budget the department mocks are held to.
      # Warm it answers in under a second; cold, tens of seconds - and the
      # short budget marked both departments offline on every cold start.
      GRID_UPSTREAM_TIMEOUT_SECONDS: ${GRID_UPSTREAM_TIMEOUT_SECONDS:-25}
      GRID_UPSTREAM_RETRIES: ${GRID_UPSTREAM_RETRIES:-2}
      TRAFFIC_VMS_ENABLED: "true"
      MUNICIPAL_VMS_ENABLED: "true"
      TRAFFIC_VMS_BASE_URL: http://traffic-vms:8001
      TRAFFIC_VMS_API_KEY: ${TRAFFIC_VMS_API_KEY:-traffic-demo-key}
      MUNICIPAL_VMS_BASE_URL: http://municipal-vms:8002
      MUNICIPAL_VMS_TOKEN: ${MUNICIPAL_VMS_TOKEN:-municipal-demo-token}
      JWT_SECRET: ${JWT_SECRET:-vigentra-module1-demo-secret-change-me}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-DEMO}
      # The always-on detector services below run real YOLO inference.
      YOLO_ENABLE: "true"
      # Vigentra never exposes footage; both flags remain absent by design.
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      traffic-vms: { condition: service_started }
      municipal-vms: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health?deep=false', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Edge analytics. Off unless you ask for it: `docker compose --profile anpr up`
  #
  # Kept behind a profile because it is the only service here that needs a CV
  # stack, wants a couple of GB of RAM, and will happily saturate a CPU. A
  # registry demo should not drag that in by default - but a *count* is only
  # meaningful if something has been counting continuously, so when it is on it
  # runs forever rather than once.
  #
  # Detections land in Postgres like any other write, which is what makes the
  # numbers survive a browser reload, a dashboard restart, or the worker itself
  # being stopped and started again. Nothing about the count lives in the page.
  # ---------------------------------------------------------------------------
  edge-worker:
    # Signs in as traffic.ai like detector-traffic, so with this profile on the
    # Traffic cameras are processed twice (duplicates collapse on ingest) and a
    # seventh stream is opened. Stop detector-traffic while it runs if the
    # gateway starts refusing the account.
    profiles: ["anpr"]
    build:
      context: .
      dockerfile: services/edge-worker/Dockerfile
      # The ANPR target carries the plate models; the yolo target is vehicles
      # only and starts far faster if that is all you need.
      target: anpr
    image: vigentra/edge-worker:0.2.0
    restart: unless-stopped
    environment:
      CENTRAL_API_URL: http://central-api:8000
      EDGE_USERNAME: ${EDGE_USERNAME:-traffic.ai}
      EDGE_PASSWORD: ${EDGE_PASSWORD:-AiOps@2026}
      SENTINEL_GRID_BASE_URL: ${SENTINEL_GRID_BASE_URL:-https://cctv.corp8.cloud}
      SENTINEL_GRID_PASSWORD: ${SENTINEL_GRID_PASSWORD:-}
      SENTINEL_GRID_EMAIL: ${SENTINEL_GRID_EMAIL:-}
      SENTINEL_GRID_RTSP_HOST: ${SENTINEL_GRID_RTSP_HOST:-103.250.160.189}
      ANPR_ENABLE: "true"
      ANPR_MODELS_DIR: /app/models
      # torch and paddle each ship an Intel OpenMP runtime; loading both aborts
      # the process without this.
      KMP_DUPLICATE_LIB_OK: "TRUE"
    # --forever is the whole point: every camera the account may watch, cycling
    # continuously, so the counts keep accumulating without anyone running a
    # command. --cycle-seconds paces it - each client gets its own copy of the
    # stream and the guide asks callers to pace their load.
    command: >
      python -m app.worker --all-cameras --forever
      --max-frames ${EDGE_MAX_FRAMES:-25}
      --sample-interval ${EDGE_SAMPLE_INTERVAL:-20}
      --cycle-seconds ${EDGE_CYCLE_SECONDS:-120}
    depends_on:
      central-api: { condition: service_healthy }

  # ---------------------------------------------------------------------------
  # Live-wall frames. The grid HLS CDN delivers a 6 s segment in 15-80 s and
  # 403s under concurrency, so a browser HLS wall of thirty tiles blacks out.
  # This decodes the same cameras over the real-time RTSP gateway (every codec,
  # HEVC included) with a bounded pool and serves each camera's latest frame as
  # a JPEG, which central-api proxies. On by default because it is the only
  # path that shows the wall on a normal network; it needs no plate models, so
  # it uses the light yolo image target and starts fast.
  # ---------------------------------------------------------------------------
  grid-snapshots:
    build:
      context: .
      dockerfile: services/edge-worker/Dockerfile
      target: yolo
    image: vigentra/edge-worker-yolo:0.2.0
    restart: unless-stopped
    environment:
      SENTINEL_GRID_PASSWORD: ${SENTINEL_GRID_PASSWORD:-}
      SENTINEL_GRID_EMAIL: ${SENTINEL_GRID_EMAIL:-}
      SENTINEL_GRID_RTSP_HOST: ${SENTINEL_GRID_RTSP_HOST:-103.250.160.189}
    # --host 0.0.0.0: the default 127.0.0.1 is the container's own loopback,
    # which central-api cannot reach - every live-wall tile stays blank.
    # Pool 4 + a 15 s hold: ~14 new RTSP sessions a minute instead of ~50, each
    # camera's frame refreshed about every two minutes. --motion-size skips
    # the start-up probe, which opened 6 then 4 streams at once on every
    # restart to size a /motion grid central-api never proxies.
    command: >
      python tools/snapshot_wall.py --host 0.0.0.0 --port 9100
      --pool ${SNAPSHOT_POOL:-4} --hold ${SNAPSHOT_HOLD:-15} --motion-size ${SNAPSHOT_MOTION_SIZE:-4}
    expose: ["9100"]

  # ---------------------------------------------------------------------------
  # Object detection, always on (24/7). Unlike `edge-worker` above this needs no
  # profile and no plate models: the light yolo image, YOLO11n on CPU, every
  # camera the account may watch, cycling forever. restart: unless-stopped
  # brings a worker back after a crash, a Docker restart or a reboot (with
  # Docker Desktop set to start at login).
  #
  # One worker per department, because an AI account may ingest detections only
  # for cameras its own department owns: traffic.ai covers the Traffic share of
  # the grid and municipal.ai the Municipal share - all thirty between them.
  # ---------------------------------------------------------------------------
  detector-traffic:
    <<: *detector
    environment:
      <<: *detector-env
      EDGE_USERNAME: traffic.ai
      EDGE_PASSWORD: ${TRAFFIC_EDGE_PASSWORD:-AiOps@2026}
    volumes: [yolo_weights_traffic:/app/weights]

  detector-municipal:
    <<: *detector
    environment:
      <<: *detector-env
      EDGE_USERNAME: municipal.ai
      EDGE_PASSWORD: ${MUNICIPAL_EDGE_PASSWORD:-MuniOps@2026}
    volumes: [yolo_weights_municipal:/app/weights]

  dashboard:
    build:
      context: services/dashboard
      dockerfile: Dockerfile
    image: vigentra/dashboard:0.2.0
    restart: unless-stopped
    environment:
      CENTRAL_API_URL: http://central-api:8000
      NODE_ENV: production
      # Demo runs on plain HTTP; leave VIGENTRA_SECURE_COOKIE unset. When you
      # deploy behind TLS, set VIGENTRA_SECURE_COOKIE=1.
    ports: ["3000:3000"]
    depends_on:
      central-api: { condition: service_started }

volumes:
  sentinel_pg: {}
  yolo_weights_traffic: {}
  yolo_weights_municipal: {}
