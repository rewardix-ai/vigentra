# Vigentra Module 1 - metadata-only CCTV registry federation.
#
# Four services, each with its own health check so Compose can order start-up
# correctly:
#
#   postgres        registry storage
#   traffic-vms     Gujarat Traffic Police department system     :8001
#   municipal-vms   Municipal Corporation department system      :8002
#   central-api     Vigentra middleware (metadata-only)          :8000
#   dashboard       operator console                             :3000
#
# Bring the whole stack up with:  docker compose up --build
# Sign in from http://localhost:3000/login (accounts on that page).
#
# Turn a department system off during the demo to prove failure isolation:
#   docker compose stop municipal-vms
# Turn it back on to see cameras recover:
#   docker compose start municipal-vms   &&   click "Synchronise metadata"
services:

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
    ports: ["5432:5432"]
    volumes: [sentinel_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  traffic-vms:
    build:
      # Root context so the shared demo footage in data/videos/ can be baked in.
      context: .
      dockerfile: services/traffic-vms/Dockerfile
    image: vigentra/traffic-vms:0.2.0
    restart: unless-stopped
    environment:
      TRAFFIC_VMS_API_KEY: ${TRAFFIC_VMS_API_KEY:-traffic-demo-key}
      TRAFFIC_VMS_PUBLIC_BASE_URL: http://localhost:8001
    ports: ["8001:8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  municipal-vms:
    build:
      context: .
      dockerfile: services/municipal-vms/Dockerfile
    image: vigentra/municipal-vms:0.2.0
    restart: unless-stopped
    environment:
      MUNICIPAL_VMS_TOKEN: ${MUNICIPAL_VMS_TOKEN:-municipal-demo-token}
      MUNICIPAL_VMS_PUBLIC_BASE_URL: http://localhost:8002
    ports: ["8002:8002"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2).status == 200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  central-api:
    build:
      context: .
      dockerfile: services/central-api/Dockerfile
    image: vigentra/central-api:0.2.0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
      TRAFFIC_VMS_BASE_URL: http://traffic-vms:8001
      TRAFFIC_VMS_API_KEY: ${TRAFFIC_VMS_API_KEY:-traffic-demo-key}
      MUNICIPAL_VMS_BASE_URL: http://municipal-vms:8002
      MUNICIPAL_VMS_TOKEN: ${MUNICIPAL_VMS_TOKEN:-municipal-demo-token}
      JWT_SECRET: ${JWT_SECRET:-vigentra-module1-demo-secret-change-me}
      ENVIRONMENT_LABEL: ${ENVIRONMENT_LABEL:-DEMO / MODULE 1}
      # Vigentra never exposes footage; both flags remain absent by design.
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      traffic-vms: { condition: service_started }
      municipal-vms: { condition: service_started }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health?deep=false', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 4s
      retries: 6
      start_period: 10s

  dashboard:
    build:
      context: services/dashboard
      dockerfile: Dockerfile
    image: vigentra/dashboard:0.2.0
    restart: unless-stopped
    environment:
      CENTRAL_API_URL: http://central-api:8000
      NODE_ENV: production
      # Demo runs on plain HTTP; leave VIGENTRA_SECURE_COOKIE unset. When you
      # deploy behind TLS, set VIGENTRA_SECURE_COOKIE=1.
    ports: ["3000:3000"]
    depends_on:
      central-api: { condition: service_started }

volumes:
  sentinel_pg: {}
