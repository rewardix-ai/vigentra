[pytest]
testpaths = tests

# The edge worker's own tests import `anpr` and `app` - packages that live
# inside services/edge-worker rather than being installed, because that is the
# directory the worker runs from in its container and under
# scripts/edge-worker.ps1. Declaring the path here rather than in a second
# conftest.py is deliberate: pytest imports every conftest under its bare
# module name, so a second one collided with tests/conftest.py and broke every
# `from conftest import ...` in the main suite the moment both were collected
# in one run.
pythonpath = services/edge-worker

asyncio_mode = auto
addopts = -q --strict-markers
filterwarnings =
    ignore::DeprecationWarning
