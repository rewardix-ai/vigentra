# ANPR tuning for the Sentinel grid.
#
# The defaults in anpr/config.py are written for footage where a plate fills a
# useful part of the frame. The grid's cameras are wide junction overviews at
# 1920x1080, and a measured pass over VIGENTRA-TRAFFIC-AHM-0002 found plates
# 13-17 px tall - below anything an OCR engine can read, and small enough that
# the detector mostly missed them too: 31 vehicles, 2 plate boxes, 0 reads.
#
# Everything here buys plate size back at the cost of CPU time. Numbers are
# measured on that camera; re-measure with scripts/anpr-tune.ps1 after changes.
detect:
  # The full-frame pass ran at 640 on a 1920 frame - a 3x downscale before the
  # detector ever saw it, turning a 53 px plate into ~18 px. This is the single
  # biggest lever on this footage.
  plate_imgsz: 1280
  # Same reasoning for the pass inside each vehicle box.
  roi_imgsz: 960
  # Vehicle crops are upscaled to at least this before the ROI plate pass. At
  # 320 a distant car's plate was still sub-20 px going in.
  roi_min_size: 480
  # Vehicle crops per plate-detector call.
  roi_batch: 6
  # The prior band (a plate-sized strip cut from the vehicle box when no
  # detector found a plate) is OFF: measured on the Delhi clip it produced
  # 53 crops per 24 frames of the vehicle's whole lower half, each through
  # full enhancement and OCR at up to 2 s, and read nothing. With two
  # detectors that find the plate, the band only costs the frame budget.
  prior_pass: false
  # A 17 px plate scores low even when found. Recovering it and letting the
  # consensus stage reject it beats never seeing it.
  plate_conf: 0.15
  vehicle_conf: 0.30
  # YOLO11 for vehicles and BoT-SORT for tracking: the pairing the LRLPR-26
  # dataset itself was built with, so track structure here matches what the
  # published results were measured on. BoT-SORT carries appearance features
  # through occlusions that break ByteTrack's pure-IoU association - and a
  # track that fragments is a track whose frames never get fused.
  vehicle_model: yolo11n.pt
  tracker: botsort.yaml
  # The full plate detector. plate_detector_s.pt is the same architecture at
  # 18 MB instead of 38 MB and finds fewer distant plates; swap to it only on
  # a host too tight on memory to load this one, where a worker that runs at
  # slightly lower recall beats a worker that will not start.
  plate_model: plate_detector.pt
  # Full-frame pass: the original model. Measured on 382 frames of cameras 6
  # and 7, it boxes 35-38 plates on the whole frame where the crop-trained
  # model boxes 10; inside vehicle boxes the crop-trained model is the
  # cleaner of the two. One model per pass.
  plate_model_frame: plate_detector_frame.pt

enhance:
  # Plates arrive far below this, so upscaling does real work here.
  ocr_height: 96
  # Three variants, not six: CLAHE, the enhanced base and the sharpened
  # one carry the reads; the others cost a PaddleOCR call each and were
  # measured to change nothing on this footage. Real time needs the budget.
  max_variants: 3

ocr:
  # PaddleOCR only, for now. Measured on 49 real plates cut to the detector's
  # box: PaddleOCR reads 37% exactly (68% of characters) and the trained
  # reader (anpr/reader.py, runs/reader/R5_staged) reads 0% (31% of
  # characters). The reader stays in the code and in training; it is added
  # back here ([reader, paddle]) only when it beats PaddleOCR on that test.
  engines: [paddle]
  # Sum the reader's per-column log-probabilities across the frames of a track
  # and decode once. Off for PaddleOCR (its columns shift with the crop); the
  # reader's 48-column grid is fixed, which is what makes this valid.
  fuse_track_logits: true
  fuse_frames: 5
  fuse_min_frames: 2
  min_confidence: 0.25
  # No size floor: every plate the detector finds is enhanced and read,
  # whatever its width. The old floor of 40 px was where the general-purpose
  # recogniser stopped returning anything but inventions; with the
  # plate-trained reader (anpr/reader.py) the grammar and confidence gates
  # alone decide what is reported.
  min_plate_width: 0

consensus:
  # Traffic crosses these junctions quickly and the worker samples every 5th
  # frame, so a vehicle is often present for only two sampled frames. Three
  # observations meant a plate that WAS read could still never be confirmed.
  min_observations: 2
  min_score: 0.50
  min_margin: 0.15

scheduler:
  # At most this many plates go to OCR per frame; the rest wait a frame.
  # A vehicle is in view for seconds, so spreading reads across frames costs
  # nothing the consensus notices and keeps the frame under budget.
  max_ocr_per_frame: 3
