# Per-camera configuration (anpr/camera/profile.py).
#
# One global pipeline, tuned per camera without code changes. For the camera an engine is built for
# (matched by key or alias, case-insensitively; the worker offers the canonical registry id and the grid
# id, e.g. cam06):
#   thresholds     deep-merged over thresholds.yaml (only keys that differ from the global file)
#   sampling       AdaptiveSampler: stride (null = the worker's --sample-interval), burst_frames, burst_plate_px
#   frame_quality  FrameQualityRouter: night_mode auto | on | off, plus any router argument
# Everything else is description for operators, measured by tools/anpr_profile_cameras.py on the recorded
# clips (docs/anpr-baseline.md): lighting, which plate side the camera mostly sees, the median widest plate
# per track, and the diagnostic difficulty class. The pipeline does not read it.
#
# A value belongs here only when it was measured to help that camera (docs/anpr-optimisation.md);
# ROI and overlay rectangles stay in roi.yaml.

defaults:
  thresholds: {}
  sampling: {stride: null}
  frame_quality: {night_mode: auto}

cameras:
