# Per-camera configuration (anpr/camera/profile.py).
#
# One global pipeline, tuned per camera without code changes. For the camera an engine is built for
# (matched by key or alias, case-insensitively; the worker offers the canonical registry id and the grid
# id, e.g. cam06):
#   thresholds     deep-merged over thresholds.yaml (only keys that differ from the global file)
#   sampling       AdaptiveSampler: stride (null = the worker's --sample-interval), burst_frames, burst_plate_px
#   frame_quality  FrameQualityRouter: night_mode auto | on | off, plus any router argument
#   intrusion      a restricted zone for this camera (anpr/incidents.py): anything tracked - or only the classes
#                  listed - whose foot point stays inside the polygon raises an INTRUSION incident. The live ANPR
#                  tracker follows vehicles only (car, motorcycle, bus, truck), so person zones need a person tracker. Fractions of the
#                  frame; `hours` are the local hours it is armed between, omit for always. Example:
#                    intrusion: {zone: [[0.55, 0.60], [1.0, 0.60], [1.0, 1.0], [0.55, 1.0]],
#                                classes: [car, truck], dwell_seconds: 2, hours: [22, 6]}
#                  No camera ships with one: a zone is drawn by the department that owns the site.
# Everything else is description for operators, measured by tools/anpr_profile_cameras.py on the recorded
# clips (docs/anpr-baseline.md): lighting, which plate side the camera mostly sees, the median widest plate
# per track, and the diagnostic difficulty class. The pipeline does not read it.
#
# A value belongs here only when it was measured to help that camera (docs/anpr-optimisation.md);
# ROI and overlay rectangles stay in roi.yaml.

defaults:
  thresholds: {}
  sampling: {stride: null}
  # off: never CLAHE a whole dark frame before detection. On rec_cam07 (median luma 41) the enhanced frame
  # cost a third of the tracked detections; no camera measured better with it on. A camera may set
  # night_mode: auto or on for itself.
  frame_quality: {night_mode: off}

cameras:
  cam01:
    # no plate here is wide enough to read, so this camera gets the small pass budget; its stride
    # stays the worker's own, because the frames still count vehicles and detection is cheap
    sampling: {max_frames: 25}
